name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Iconos y pantalla de inicio
        run: npx capacitor-assets generate --android --iconBackgroundColor '#141414' --iconBackgroundColorDark '#141414' --splashBackgroundColor '#141414' --splashBackgroundColorDark '#141414'
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: |
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LaForja.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: La Forja para Android (versión ${{ github.run_number }})
          body: |
            Descarga **LaForja.apk** en tu móvil Android y ábrelo para instalarlo.
            La app carga siempre la última versión de la Forja: no hace falta reinstalarla cuando se añaden listas o libros.
          files: android-app/LaForja.apk
          make_latest: true
